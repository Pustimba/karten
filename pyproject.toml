[project]
name = "zugbindung"
version = "1.0.0"
description = "Bahnverbindungen finden, deren Zugbindung mit hoher Wahrscheinlichkeit entfällt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "curl_cffi>=0.7",
]

[project.scripts]
zugbindung = "zugbindung.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zugbindung"]
